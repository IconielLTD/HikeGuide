plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is driven by android/key.properties (kept out of version
// control — see android/.gitignore). When that file is absent, the release
// build falls back to debug signing so `flutter run --release` and current
// field-test builds keep working with no setup. To ship a real signed build,
// create the keystore + key.properties (instructions in android/SIGNING.md).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// A release APK signed with the debug key can't update an install signed with
// the release key, so people would have to uninstall (losing their trips) or
// go looking for the APK elsewhere. So release builds need key.properties (see
// android/SIGNING.md). For a quick personal release build without it, set
// HIKEGUIDE_ALLOW_DEBUG_SIGNING=1 and it's debug-signed as before. Checked
// when the task graph is ready, so debug builds and `flutter run` never trip it.
def allowDebugSigning = System.getenv("HIKEGUIDE_ALLOW_DEBUG_SIGNING") == "1"
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.project == project && it.name ==~ /(assemble|bundle|package)Release/
    }
    if (buildsRelease && !hasReleaseKeystore && !allowDebugSigning) {
        throw new GradleException(
            "Release build without android/key.properties. Set up the release key " +
            "(android/SIGNING.md), or set HIKEGUIDE_ALLOW_DEBUG_SIGNING=1 for a " +
            "personal debug-signed build that must not be distributed.")
    }
}

android {
    namespace = "com.nfosborn.hikeguide"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.nfosborn.hikeguide"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Only declared when key.properties is present; otherwise referencing it
        // below would fail, so the release build uses the debug config instead.
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Real signing once a keystore is configured; debug fallback keeps
            // current `flutter run --release` / field-test builds working as-is.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
