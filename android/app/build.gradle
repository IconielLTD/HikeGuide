plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing (android/SIGNING.md). android/key.properties (kept out of
// version control) says WHERE the keystore is — storeFile and keyAlias. The
// two PASSWORDS are deliberately not read from any file: they come from the
// HIKEGUIDE_STORE_PASSWORD / HIKEGUIDE_KEY_PASSWORD environment variables,
// which release.ps1 sets for one release build only. Otherwise anything that
// can read files as you (malware, or any code that runs during an ordinary
// build) would get the key and its passwords together, and could sign a fake
// "update" that Android installs over the real app.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStorePassword = System.getenv("HIKEGUIDE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("HIKEGUIDE_KEY_PASSWORD") ?: releaseStorePassword
// Older setups kept the passwords in key.properties; they're ignored now.
def passwordsLeftInFile = keystoreProperties.containsKey("storePassword") ||
        keystoreProperties.containsKey("keyPassword")

// A release APK signed with the debug key can't update an install signed with
// the release key, so people would have to uninstall (losing their trips) or
// go looking for the APK elsewhere. So release builds need key.properties (see
// android/SIGNING.md). For a quick personal release build without it, set
// HIKEGUIDE_ALLOW_DEBUG_SIGNING=1 and it's debug-signed as before. Checked
// when the task graph is ready, so debug builds and `flutter run` never trip it.
def allowDebugSigning = System.getenv("HIKEGUIDE_ALLOW_DEBUG_SIGNING") == "1"
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.project == project && it.name ==~ /(assemble|bundle|package)Release/
    }
    if (!buildsRelease) return
    if (!hasReleaseKeystore) {
        if (allowDebugSigning) return
        throw new GradleException(
            "Release build without android/key.properties. Set up the release key " +
            "(android/SIGNING.md), or set HIKEGUIDE_ALLOW_DEBUG_SIGNING=1 for a " +
            "personal debug-signed build that must not be distributed.")
    }
    if (passwordsLeftInFile) {
        logger.warn("WARNING: android/key.properties still contains storePassword/" +
            "keyPassword. They're no longer used: once they're saved in your " +
            "password manager, delete those two lines (android/SIGNING.md).")
    }
    if (!releaseStorePassword) {
        throw new GradleException(
            "No keystore password. Build releases with .\\release.ps1, which asks " +
            "for the passwords (android/SIGNING.md).")
    }
}

android {
    namespace = "com.nfosborn.hikeguide"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.nfosborn.hikeguide"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Android 8.0+. Flutter's default (24, Android 7.0) would let the app
        // install on devices that haven't had security updates for years.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Only declared when key.properties is present; otherwise referencing it
        // below would fail, so the release build uses the debug config instead.
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = releaseKeyPassword
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            // Real signing once a keystore is configured; debug fallback keeps
            // current `flutter run --release` / field-test builds working as-is.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
